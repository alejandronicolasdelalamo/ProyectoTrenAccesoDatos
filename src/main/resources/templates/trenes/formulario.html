<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${tren.id != null} ? 'Editar Tren' : 'Nuevo Tren'">Formulario Tren</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4 mb-5" style="max-width: 600px;">

    <h2 class="mb-4" th:text="${tren.id != null} ? 'Editar Tren' : 'Nuevo Tren'">Formulario</h2>

    <form th:action="@{/trenes/guardar}" th:object="${tren}" method="post" class="card card-body shadow-sm">
        
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Fabricante:</label>
            <input type="text" th:field="*{fabricante}" class="form-control" th:errorclass="is-invalid" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fabricante')}" th:errors="*{fabricante}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Modelo:</label>
            <input type="text" th:field="*{modelo}" class="form-control" th:errorclass="is-invalid" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('modelo')}" th:errors="*{modelo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Matrícula:</label>
            <input type="text" th:field="*{matricula}" class="form-control" th:errorclass="is-invalid" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Año:</label>
                <input type="number" th:field="*{anio}" class="form-control" th:errorclass="is-invalid" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('anio')}" th:errors="*{anio}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Precio (€):</label>
                <input type="number" step="0.01" th:field="*{precio}" class="form-control" th:errorclass="is-invalid" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Velocidad Máxima (km/h):</label>
                <input type="number" th:field="*{velocidadMaxima}" class="form-control" th:errorclass="is-invalid" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('velocidadMaxima')}" th:errors="*{velocidadMaxima}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Color:</label>
                <input type="text" th:field="*{color}" class="form-control" />
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de Propulsión:</label>
            <select th:field="*{propulsion}" class="form-select" th:errorclass="is-invalid">
                <option value="">-- Seleccionar Propulsión --</option>
                <option th:each="p : ${propulsiones}" th:value="${p}" th:text="${p}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('propulsion')}" th:errors="*{propulsion}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de Servicio:</label>
            <select th:field="*{tipoServicio}" class="form-select" th:errorclass="is-invalid">
                <option value="">-- Seleccionar Servicio --</option>
                <option th:each="ts : ${tiposServicio}" th:value="${ts}" th:text="${ts}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('tipoServicio')}" th:errors="*{tipoServicio}"></div>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <a th:href="@{/trenes}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-success">Guardar</button>
        </div>

    </form>

</body>
</html>
