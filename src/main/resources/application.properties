spring.application.name=tren

# Activa el perfil 'local' automáticamente: si existe application-local.properties
# sus valores pisan los de aquí abajo.
spring.profiles.active=local

# Puerto de la aplicación (8081)
server.port=8081

# Conexión a MySQL. Crea la base de datos 'tren_db' automáticamente si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/tren_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: el esquema lo crean schema.sql / data.sql, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ejecuta schema.sql y data.sql en cada arranque, antes de que Hibernate valide el esquema
spring.sql.init.mode=always